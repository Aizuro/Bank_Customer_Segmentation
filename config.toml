# Letakkan file ini di: <folder proyek>/.streamlit/config.toml
# (buat folder bernama ".streamlit" di sebelah app.py). Hapus file ini untuk kembali ke tema bawaan.

[theme]
base = "light"
primaryColor = "#0F9D8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F7"
textColor = "#1F2430"
font = "sans serif"

[client]
toolbarMode = "minimal"   # menyembunyikan tombol Deploy
